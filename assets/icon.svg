<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Arka Plan Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <!-- Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Yuvarlatılmış Arka Plan Kartı -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#334155" stroke-width="4"/>

  <!-- TV Ekran Çerçevesi -->
  <rect x="28" y="28" width="72" height="52" rx="8" fill="none" stroke="url(#accentGrad)" stroke-width="6"/>
  
  <!-- TV Ayağı -->
  <path d="M52 80 L76 80 M64 80 L64 90 M48 90 L80 90" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round"/>

  <!-- Android ADB Antenleri (TV'nin Üstünde) -->
  <path d="M46 20 L54 28 M82 20 L74 28" stroke="#a3e635" stroke-width="4" stroke-linecap="round"/>

  <!-- Cast / Play Simgesi (Ekran Ortası) -->
  <polygon points="56,42 56,66 78,54" fill="#38bdf8"/>

  <!-- Sağ Alt Online Sinyal Noktası -->
  <circle cx="92" cy="92" r="8" fill="#22c55e"/>
  <circle cx="92" cy="92" r="14" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.5"/>
</svg>
